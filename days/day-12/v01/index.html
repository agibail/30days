<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 12 · Art Recipe Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --desk: #e8dfcd;
      --desk-2: #ddd2bb;
      --kraft: #c69c6d;
      --kraft-dark: #9c7346;
      --kraft-edge: #7d5a35;
      --manila: #f0d99c;
      --manila-dark: #d9bd76;
      --card: #fffdf6;
      --rule: #b7d0e8;
      --margin: #e58a8c;
      --ink: #2a2830;
      --ink-soft: #5d5966;
      --pencil: #b3262e;
      --red: #c8262f;
      --red-dark: #8e161d;
      --red-deep: #5e0d12;
      --line: 28px;
      --type: "Special Elite", "Courier New", monospace;
      --body: "Courier Prime", "Courier New", monospace;
      --hand: "Caveat", "Bradley Hand", cursive;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 17px/var(--line) var(--body);
      background:
        radial-gradient(1200px 600px at 50% -10%, #f3ecdd 0%, transparent 70%),
        repeating-linear-gradient(92deg, transparent 0 38px, rgba(120, 90, 50, .035) 38px 40px, transparent 40px 91px),
        var(--desk);
      overflow-x: hidden;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    main { max-width: 760px; margin: 0 auto; padding: 28px 16px 160px; }

    /* ---------- index card ---------- */
    .card {
      position: relative;
      background:
        linear-gradient(var(--card), var(--card)) top / 100% 64px no-repeat,
        linear-gradient(var(--margin), var(--margin)) 0 63px / 100% 2px no-repeat,
        repeating-linear-gradient(to bottom, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)) 0 64px / 100% 100%,
        var(--card);
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 10px 24px -12px rgba(60, 40, 10, .45), 0 2px 6px rgba(60, 40, 10, .12);
      padding: 0 24px 28px;
    }
    .card-head {
      height: 64px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
      padding-bottom: 10px;
    }
    .card-head h1, .card-head h2 {
      font: 400 clamp(22px, 5.4vw, 32px)/1.1 var(--type);
      margin: 0; letter-spacing: .01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .no { font: 13px/1 var(--type); color: var(--ink-soft); white-space: nowrap; padding-bottom: 4px; }
    .stamp {
      display: inline-block;
      font: 12px/1 var(--type); text-transform: uppercase; letter-spacing: .12em;
      color: var(--pencil); border: 1.5px solid currentColor; border-radius: 3px;
      padding: 4px 6px 3px; transform: rotate(-3deg); opacity: .85;
    }

    /* ---------- ask card ---------- */
    .ask { margin-bottom: 36px; transform: rotate(-.6deg); }
    .ask form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 12px; margin-top: var(--line); }
    .ask label { font-family: var(--type); white-space: nowrap; line-height: var(--line); }
    .ask input {
      flex: 1 1 220px; min-width: 0;
      border: 0; background: transparent; outline: none;
      font: 700 22px/var(--line) var(--body); height: var(--line);
      padding: 0 2px; color: #1d3f8f;
    }
    .ask input::placeholder { color: #a7a2ad; font-weight: 400; }
    .btn {
      font: 15px/1 var(--type); letter-spacing: .04em;
      border: 1.5px solid var(--ink); background: transparent; border-radius: 3px;
      padding: 7px 12px 6px; height: var(--line); margin-top: 0;
      transition: background .15s, color .15s, transform .1s;
    }
    .btn:hover { background: var(--ink); color: var(--card); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .strip:focus-visible, .tin:focus-visible { outline: 2px dashed #1d3f8f; outline-offset: 3px; }
    .try { margin: var(--line) 0 0; color: var(--ink-soft); }
    .chip {
      border: 0; background: none; padding: 0; margin: 0 2px;
      font: 700 17px/var(--line) var(--hand); font-size: 21px; color: var(--pencil);
      text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    }
    .chip:hover { color: var(--ink); }

    /* ---------- pulled (result) card ---------- */
    #pulled { position: relative; z-index: 3; margin-bottom: 44px; }
    #pulled:empty { display: none; }
    .result { animation: pull .55s cubic-bezier(.2, .9, .25, 1.05) both; }
    @keyframes pull {
      from { transform: translateY(120px) rotate(1.2deg); opacity: 0; }
      60% { opacity: 1; }
      to { transform: translateY(0) rotate(.4deg); }
    }
    .result .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: var(--line); margin-top: 0; }
    .result h3 {
      font: 400 15px/var(--line) var(--type); text-transform: uppercase; letter-spacing: .12em;
      margin: var(--line) 0 0; color: var(--ink-soft);
    }
    .result ul, .result ol { margin: 0; padding-left: 26px; }
    .result ul.materials { columns: 2 220px; column-gap: 28px; list-style: "– "; }
    .result ul.materials li { break-inside: avoid; }
    .result ol li::marker { font-family: var(--type); color: var(--ink-soft); }
    .result p { margin: 0; }
    .desc { color: var(--ink-soft); font-style: italic; }
    .note {
      font: 600 23px/var(--line) var(--hand); color: var(--pencil);
      margin-top: var(--line) !important; transform: rotate(-.4deg);
    }
    .note b { font-weight: 700; }
    .guides { list-style: none !important; padding-left: 0 !important; }
    .guides a {
      text-decoration: underline; text-decoration-color: var(--rule); text-decoration-thickness: 2px; text-underline-offset: 4px;
    }
    .guides a:hover { text-decoration-color: var(--pencil); color: var(--pencil); }
    .guides .main-link a { font-weight: 700; color: #1d3f8f; }
    .also { color: var(--ink-soft); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: var(--line); align-items: center; }
    .save {
      font: 15px/1 var(--type); letter-spacing: .05em;
      background: var(--red); color: #fff; border: 0; border-radius: 3px;
      height: var(--line); padding: 0 14px;
      box-shadow: 0 2px 0 var(--red-dark);
      transition: transform .1s, background .15s;
    }
    .save:hover { background: #d7323b; }
    .save:active { transform: translateY(2px); box-shadow: none; }
    .save.saved { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
    .linkish { border: 0; background: none; padding: 0; font: 15px/var(--line) var(--type); color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
    .linkish:hover { color: var(--ink); }

    /* ---------- the box ---------- */
    .box-wrap { position: relative; z-index: 1; padding-top: 56px; }
    .box {
      position: relative;
      background: linear-gradient(#6f4f2d, #8a6640);
      border-radius: 8px 8px 0 0;
      padding: 0 14px;
    }
    .box::before { /* back wall rim */
      content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 16px;
      background: linear-gradient(var(--kraft-dark), var(--kraft-edge));
      border-radius: 8px 8px 0 0;
    }
    .tabs {
      position: relative; z-index: 1;
      display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;
      margin: -52px -4px 0; padding: 18px 4px 0;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      font: 14px/1 var(--type); letter-spacing: .04em;
      background: linear-gradient(var(--manila), #ead08a);
      border: 0; border-radius: 6px 6px 0 0;
      padding: 9px 12px 30px;
      box-shadow: inset 0 -1px 0 var(--manila-dark), 0 -1px 2px rgba(0,0,0,.12);
      transform: translateY(calc(-1 * var(--lift, 0px)));
      transition: transform .2s;
    }
    .tab:nth-child(3n+2) { --lift: 7px; }
    .tab:nth-child(3n) { --lift: 13px; }
    .tab:hover { transform: translateY(calc(-1 * var(--lift, 0px) - 4px)); }
    .tab[aria-selected="true"] { transform: translateY(calc(-1 * var(--lift, 0px) - 4px)); background: linear-gradient(#fbe8b3, var(--manila)); font-weight: 700; }
    .divider-body {
      position: relative; z-index: 2;
      background: linear-gradient(#fbe8b3, var(--manila));
      border-radius: 0 4px 0 0;
      height: 22px; margin: -14px 0 0;
      box-shadow: 0 -2px 3px rgba(0,0,0,.12);
    }
    .strips { position: relative; z-index: 2; padding: 0 6px 120px; margin-bottom: -112px; }
    .strip {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      width: 100%; text-align: left;
      height: 40px; margin-top: -2px;
      border: 0; border-radius: 3px 3px 0 0;
      padding: 0 14px;
      background:
        linear-gradient(var(--margin), var(--margin)) 0 38px / 100% 2px no-repeat,
        var(--card);
      box-shadow: 0 -3px 5px -2px rgba(50, 30, 5, .35);
      font: 16px/1 var(--type);
      transition: transform .18s ease;
    }
    .strip:hover { transform: translateY(-8px); }
    .strip small { font: 12px/1 var(--type); color: var(--ink-soft); }
    .box-front {
      position: relative; z-index: 3;
      margin: 0 -14px;
      height: 150px;
      background:
        radial-gradient(140% 90% at 50% 0%, rgba(255,255,255,.18), transparent 60%),
        repeating-linear-gradient(90deg, rgba(90,60,25,.05) 0 2px, transparent 2px 7px),
        linear-gradient(var(--kraft), #b88b5b);
      border-radius: 4px 4px 10px 10px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -8px 12px rgba(80,50,20,.25), 0 18px 30px -14px rgba(60,40,10,.6);
      display: grid; place-items: center;
    }
    .label-holder {
      background: linear-gradient(#d9d7d2, #a9a6a0);
      padding: 6px; border-radius: 4px;
      box-shadow: 0 2px 3px rgba(0,0,0,.3), inset 0 1px 0 #fff;
      transform: translateY(-6px);
    }
    .label-holder span {
      display: block; background: var(--card); padding: 6px 18px 5px;
      font: 15px/1.2 var(--type); letter-spacing: .14em; text-transform: uppercase;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.25);
    }
    .pull-hole { width: 54px; height: 18px; border-radius: 0 0 30px 30px; background: rgba(60,35,10,.35); position: absolute; top: 0; left: 50%; transform: translateX(-50%); box-shadow: inset 0 3px 4px rgba(0,0,0,.35); }
    .box-caption { text-align: center; color: var(--ink-soft); font: 20px/1.2 var(--hand); margin-top: 18px; }

    /* ---------- the red box (closed tin) ---------- */
    .tin {
      position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 20;
      width: 132px; height: 92px; border: 0; padding: 0;
      background: none;
      filter: drop-shadow(0 10px 12px rgba(80, 10, 10, .35));
      transition: transform .2s;
    }
    .tin:hover { transform: translateY(-4px) rotate(-1deg); }
    .tin .lid {
      position: absolute; left: -4px; right: -4px; top: 0; height: 26px;
      background: linear-gradient(#e0434b, var(--red) 55%, #a91c24);
      border-radius: 6px 6px 3px 3px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
    }
    .tin .lid::after { content: ""; position: absolute; left: 50%; top: 9px; width: 30px; height: 6px; margin-left: -15px; border-radius: 4px; background: #e9e5df; box-shadow: inset 0 -1px 1px rgba(0,0,0,.3); }
    .tin .body {
      position: absolute; left: 0; right: 0; top: 24px; bottom: 0;
      background: linear-gradient(var(--red), #b31f28);
      border-radius: 2px 2px 8px 8px;
      display: grid; place-items: center;
    }
    .tin .tag { background: var(--card); color: var(--ink); font: 12px/1 var(--type); letter-spacing: .12em; padding: 5px 9px 4px; border-radius: 2px; text-transform: uppercase; }
    .tin .count {
      position: absolute; top: -10px; right: -10px; min-width: 28px; height: 28px; padding: 0 6px;
      border-radius: 14px; background: var(--card); color: var(--red-dark);
      font: 700 15px/28px var(--body); text-align: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    .tin.bump { animation: bump .5s ease; }
    @keyframes bump { 30% { transform: translateY(-10px) rotate(-3deg); } 60% { transform: translateY(2px) rotate(2deg); } }

    /* ---------- the red box (open) ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(60, 12, 14, .82);
      display: block;
      padding: 16px;
      overflow-y: auto;
      animation: fade .2s ease both;
    }
    .overlay[hidden] { display: none; }
    @keyframes fade { from { opacity: 0; } }
    .redbox { width: min(760px, 100%); margin: 24px auto 40px; animation: rise .35s cubic-bezier(.2,.9,.3,1) both; }
    @keyframes rise { from { transform: translateY(60px); opacity: 0; } }
    .redbox-top { display: flex; justify-content: space-between; align-items: end; gap: 12px; color: #fff; margin-bottom: 18px; }
    .redbox-top h2 { margin: 0; font: 400 28px/1.1 var(--type); }
    .redbox-top p { margin: 4px 0 0; font: 20px/1.2 var(--hand); opacity: .85; }
    .close { background: var(--card); color: var(--ink); border: 0; border-radius: 3px; font: 15px/1 var(--type); padding: 8px 12px; }
    #redView:empty { display: none; }
    #redView { position: relative; z-index: 3; margin-top: 28px; }
    .redbox .box { background: linear-gradient(var(--red-deep), #7a1218); padding-top: 22px; }
    .redbox .box::before { background: linear-gradient(var(--red-dark), #6f1016); }
    .redbox .box-front { background: radial-gradient(140% 90% at 50% 0%, rgba(255,255,255,.22), transparent 60%), linear-gradient(var(--red), #a91c24); height: 90px; }
    .redbox .strips { padding-top: 6px; }
    .empty-red { color: #f5d9d9; font: 22px/1.3 var(--hand); text-align: center; padding: 26px 10px 130px; margin-bottom: -112px; position: relative; z-index: 2; }

    /* flying card */
    .flyer { position: fixed; z-index: 40; pointer-events: none; border-radius: 4px; background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.3); }

    @media (max-width: 520px) {
      .card { padding: 0 16px 28px; }
      .tin { width: 104px; height: 76px; }
      .tin .lid { height: 22px; }
      .tin .body { top: 20px; }
      .tin .tag { font-size: 10px; }
      .strip small { display: none; }
    }
    @media print {
      body { background: #fff; }
      main > *:not(#pulled), .tin, .actions { display: none !important; }
      .overlay:not([hidden]) { position: static; background: none; padding: 0; }
      body:has(.overlay:not([hidden])) main, .redbox-top, .redbox .box { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card ask" aria-labelledby="title">
      <div class="card-head">
        <h1 id="title">Art Recipe Box</h1>
        <span class="no">Day 12</span>
      </div>
      <form id="askForm" autocomplete="off">
        <label for="q">Technique:</label>
        <input id="q" name="q" type="text" placeholder="e.g. egg tempera" enterkeyhint="search" required>
        <button class="btn" type="submit">Look it up</button>
      </form>
      <p class="try">Try:
        <button class="chip" type="button">cyanotype</button>,
        <button class="chip" type="button">paper marbling</button>,
        <button class="chip" type="button">walnut ink</button>,
        <button class="chip" type="button">shibori</button>,
        <button class="chip" type="button">salt dough</button>, or
        <button class="chip" type="button" data-random>surprise me</button>
      </p>
    </section>

    <section id="pulled" aria-live="polite"></section>

    <section class="box-wrap" aria-label="Every card in the box">
      <div class="box">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="divider-body"></div>
        <div class="strips" id="strips"></div>
        <div class="box-front"><span class="pull-hole"></span><div class="label-holder"><span id="boxLabel">Techniques</span></div></div>
      </div>
      <p class="box-caption">Pick a divider, then pull a card. Anything not in the box, I'll go find.</p>
    </section>
  </main>

  <button class="tin" id="tin" type="button" aria-label="Open your red box of saved cards">
    <span class="lid"></span>
    <span class="body"><span class="tag">Saved</span></span>
    <span class="count" id="count">0</span>
  </button>

  <div class="overlay" id="overlay" hidden>
    <div class="redbox" role="dialog" aria-modal="true" aria-labelledby="redTitle">
      <div class="redbox-top">
        <div>
          <h2 id="redTitle">My Red Box</h2>
          <p id="redSub">Directions you've kept.</p>
        </div>
        <button class="close" id="closeRed" type="button">Close ✕</button>
      </div>
      <div class="box">
        <div class="strips" id="redStrips"></div>
        <div class="box-front"><div class="label-holder"><span>Keep</span></div></div>
      </div>
      <div id="redView"></div>
    </div>
  </div>

<script>
/* ============================================================
   The card file. Every card: name, category, aliases (what people
   might type), what you need, directions, a pencilled note.
   ============================================================ */
const CATS = [
  ["paint", "Paint"], ["draw", "Draw & Ink"], ["print", "Print"], ["paper", "Paper"],
  ["fiber", "Fiber & Dye"], ["clay", "Clay & Cast"], ["photo", "Photo"], ["wax", "Wax & Gold"]
];

const CARDS = [
  { name: "Cyanotype", cat: "photo", aliases: ["cyanotypes", "sun print", "sun printing", "blueprint", "blue print"],
    yields: "About 40 postcard-size prints",
    need: ["25 g ferric ammonium citrate (green)", "10 g potassium ferricyanide", "200 ml distilled water", "2 brown glass bottles", "Heavy watercolor paper", "Foam brush", "Sheet of glass", "Gloves"],
    steps: ["Solution A: dissolve the ferric ammonium citrate in 100 ml water. Solution B: dissolve the potassium ferricyanide in 100 ml water. Let both rest 24 hours.",
      "In dim light, mix equal parts A and B — only what you'll use today.",
      "Brush an even coat onto the paper and let it dry flat in the dark.",
      "Lay leaves, lace or a printed negative on the paper and press flat under glass.",
      "Set it in full sun for 5–20 minutes, until the exposed paper turns bronze-grey.",
      "Rinse in cool running water about 5 minutes, until the whites clear. Dry flat — the blue deepens overnight."],
    note: "Gloves on, and keep these bottles away from kitchen things. A splash of hydrogen peroxide in the rinse makes the blue jump instantly." },

  { name: "Egg Tempera", cat: "paint", aliases: ["tempera", "egg paint", "egg yolk paint"],
    need: ["1 fresh egg", "Dry pigments", "Distilled water", "Palette knife", "Glass or ceramic palette", "Small round brushes", "A gessoed wooden panel"],
    steps: ["Separate the egg and roll the yolk on a paper towel to dry its skin.",
      "Pinch the yolk sac over a small jar, pierce it, and let the yolk run out. Toss the sac.",
      "Stir in about the same amount of water. That's your medium.",
      "Grind each pigment with a little water into a smooth paste.",
      "On the palette, mix roughly equal parts paste and medium. Test a swatch — dry, it shouldn't rub off or crack.",
      "Paint in thin layers with small hatched strokes, building color slowly."],
    note: "Make it fresh each day — it spoils. Only paint on something rigid; it cracks on canvas." },

  { name: "Watercolor Paint", cat: "paint", aliases: ["watercolour", "watercolors", "homemade watercolor", "watercolor", "pan paint"],
    need: ["Gum arabic (powder or liquid)", "Honey or glycerin", "Dry pigments", "Distilled water", "Glass muller & slab (or palette knife & glass)", "Empty half pans", "Dust mask"],
    steps: ["If using powder, dissolve 1 part gum arabic in 2 parts hot water and let it sit overnight.",
      "Binder: stir 4 parts gum arabic solution with 1 part honey or glycerin. A drop of clove oil keeps it from molding.",
      "Pile about a teaspoon of pigment on the slab and add binder a little at a time.",
      "Mull in slow circles until it's smooth and glossy, like toothpaste.",
      "Scrape into pans, filling in two or three layers and letting each dry.",
      "Let the pans cure 1–2 days before painting."],
    note: "Wear a mask while handling dry pigment, and never use a muller you eat with." },

  { name: "Oil Paint", cat: "paint", aliases: ["oil paints", "homemade oil paint", "mulling paint", "make oil paint"],
    need: ["Dry pigment", "Refined or cold-pressed linseed oil", "Glass muller & slab", "Palette knife", "Empty paint tubes", "Dust mask, gloves"],
    steps: ["Pile pigment on the slab and make a small well in the middle.",
      "Add oil a few drops at a time, folding with the knife into a stiff paste.",
      "Mull in figure-eights for 5–10 minutes until buttery and smooth.",
      "Add oil only if it's crumbly — too much makes paint runny and slow to dry.",
      "Fill a tube from the open back end, tap it down, and fold the end over twice."],
    note: "Some pigments are toxic (cadmiums, cobalts, leads). Mask on, gloves on, wipe the slab with a rag, not the sink." },

  { name: "Traditional Gesso", cat: "paint", aliases: ["gesso", "rabbit skin glue gesso", "chalk gesso", "panel prep"],
    need: ["Rabbit skin glue granules", "Whiting (calcium carbonate / chalk)", "Water", "Double boiler", "Wooden panel", "Wide flat brush", "Fine sandpaper"],
    steps: ["Soak 1 part glue in 10 parts water (by weight) overnight.",
      "Warm gently in a double boiler until clear. Never let it boil.",
      "Brush a coat of plain warm glue onto the panel to size it. Let dry.",
      "Sift whiting into the warm glue until it's like light cream — roughly equal volumes.",
      "Brush on 6–8 thin coats, switching direction each time, adding the next once the last loses its shine.",
      "Dry overnight, then sand glassy-smooth."],
    note: "Keep the pot warm while you work or it jells. For a quick version: acrylic gesso from a tub." },

/* ============================================================
   Finding a card
   ============================================================ */
const $ = s => document.querySelector(s);
const STORE = "art-recipe-box:red";
const enc = s => encodeURIComponent(s);

function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
}
function cleanQuery(s) {
  return norm(s)
    .replace(/^(how (do i|do you|to)( make| do)?|diy|make|making|recipe for|guide to|a|an|the)\s+/g, "")
    .replace(/^(how to|make|making|diy)\s+/, "")
    .replace(/\s+(recipe|tutorial|guide|diy|how to|technique|at home)$/g, "")
    .trim();
}
const STOP = new Set(["the", "and", "with", "for", "how", "make", "diy", "art", "homemade", "own", "your"]);
const toks = s => norm(s).split(" ").filter(t => t.length > 2 && !STOP.has(t)).map(t => t.replace(/(ies)$/, "y").replace(/s$/, ""));

function score(card, q) {
  let best = 0;
  const qt = toks(q);
  for (const term of [card.name, ...card.aliases]) {
    const n = norm(term);
    if (n === q) return 100;
    if (n.replace(/s$/, "") === q.replace(/s$/, "")) best = Math.max(best, 95);
    if (q.length >= 4 && n.includes(q)) best = Math.max(best, 60 + q.length / n.length * 20);
    if (n.length >= 4 && q.includes(n)) best = Math.max(best, 55 + n.length / q.length * 25);
    const nt = toks(term);
    if (qt.length && nt.length) {
      const hit = qt.filter(t => nt.includes(t)).length;
      if (hit) best = Math.max(best, 20 + 30 * hit / Math.max(qt.length, nt.length));
    }
  }
  return best;
}
function lookup(raw) {
  const q = cleanQuery(raw) || norm(raw);
  const ranked = CARDS.map(c => ({ c, s: score(c, q) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const hit = ranked[0] && ranked[0].s >= 45 ? ranked[0].c : null;
  const also = ranked.filter(x => x.c !== hit && x.s >= 20).slice(0, 4).map(x => x.c);
  return { q, hit, also };
}

function guideLinks(term) {
  const t = enc(term);
  return [
    { label: "Step-by-step guides on Instructables", url: `https://www.instructables.com/search/?q=${t}`, main: true },
    { label: "How-to articles on wikiHow", url: `https://www.wikihow.com/wikiHowTo?search=${t}` },
    { label: "Video tutorials on YouTube", url: `https://www.youtube.com/results?search_query=${enc(term + " tutorial")}` },
    { label: "The history, on Wikipedia", url: `https://en.wikipedia.org/wiki/Special:Search?search=${t}` }
  ];
}
const idOf = name => norm(name).replace(/ /g, "-");
const catName = k => (CATS.find(c => c[0] === k) || [k, "Found"])[1];

/* ============================================================
   Tiny element helper (no innerHTML with user text)
   ============================================================ */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

/* ============================================================
   Red box storage
   ============================================================ */
function loadRed() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
let red = loadRed();
function persist() { try { localStorage.setItem(STORE, JSON.stringify(red)); } catch {} updateCount(); }
const isSaved = id => red.some(r => r.id === id);
function updateCount() { $("#count").textContent = red.length; }

/* ============================================================
   Rendering a card
   ============================================================ */
function cardData(c) {
  return { id: idOf(c.name), name: c.name, cat: c.cat, no: CARDS.indexOf(c) + 1, yields: c.yields || "",
    need: c.need, steps: c.steps, note: c.note, links: guideLinks(c.name) };
}

function renderCard(d, opts = {}) {
  const saveBtn = h("button", { class: "save", type: "button" });
  const paintSave = () => {
    const s = isSaved(d.id);
    saveBtn.classList.toggle("saved", s);
    saveBtn.textContent = s ? "✓ In your red box — take it out" : "File in the red box";
  };
  paintSave();

  const card = h("article", { class: "card result" },
    h("div", { class: "card-head" },
      h("h2", {}, d.name),
      h("span", { class: "no" }, d.no ? "No. " + String(d.no).padStart(3, "0") : "No. —")),
    h("div", { class: "meta" },
      h("span", { class: "stamp" }, d.found ? "From the wide world" : catName(d.cat)),
      d.yields ? h("span", { class: "no" }, "Makes: " + d.yields) : null),
    d.desc ? h("p", { class: "desc" }, d.desc) : null,
    d.need && d.need.length ? [h("h3", {}, "You'll need"), h("ul", { class: "materials" }, d.need.map(x => h("li", {}, x)))] : null,
    d.steps && d.steps.length ? [h("h3", {}, "Directions"), h("ol", {}, d.steps.map(x => h("li", {}, x)))] : null,
    d.note ? h("p", { class: "note" }, h("b", {}, "Note: "), d.note) : null,
    h("h3", {}, d.found ? "Here's where to find the recipe" : "Find a guide"),
    h("ul", { class: "guides" }, d.links.map(l =>
      h("li", { class: l.main ? "main-link" : null }, h("a", { href: l.url, target: "_blank", rel: "noopener" }, l.label + " ↗")))),
    opts.also && opts.also.length ? h("p", { class: "also", style: "margin-top:28px" }, "Also in the box: ",
      opts.also.map((c, i) => [i ? ", " : "", h("button", { class: "chip", type: "button", onclick: () => show(c.name) }, c.name.toLowerCase())])) : null,
    h("div", { class: "actions" },
      saveBtn,
      h("button", { class: "linkish", type: "button", onclick: () => window.print() }, "print card"),
      opts.inRed ? null : h("button", { class: "linkish", type: "button", onclick: () => { $("#pulled").replaceChildren(); $("#q").focus(); } }, "put it back"))
  );

  saveBtn.addEventListener("click", () => {
    if (isSaved(d.id)) {
      red = red.filter(r => r.id !== d.id);
      persist();
      if (opts.inRed) { renderRed(); return; }
    } else {
      const { found, ...rest } = d;
      red.unshift({ ...rest, found: !!found, savedAt: Date.now() });
      persist();
      flyToTin(card);
    }
    paintSave();
    renderStrips();
  });
  return card;
}

/* ============================================================
   Look something up
   ============================================================ */
let lookupToken = 0;
function show(raw, { quiet = false } = {}) {
  const { q, hit, also } = lookup(raw);
  const pulled = $("#pulled");
  $("#q").value = hit ? hit.name : raw;
  if (hit) {
    const el = renderCard(cardData(hit), { also });
    if (quiet) el.style.animation = "none";
    pulled.replaceChildren(el);
  } else {
    const name = titleCase(q || raw);
    const d = { id: "found-" + idOf(name), name, cat: "found", found: true,
      desc: "Not in the box yet — checking the encyclopedia…",
      need: [], steps: [], note: "No recipe on file for this one yet — these links will get you there.",
      links: guideLinks(name) };
    pulled.replaceChildren(renderCard(d, { also }));
    const token = ++lookupToken;
    describe(name).then(text => {
      if (token !== lookupToken) return;
      d.desc = text || "";
      const fresh = renderCard(d, { also });
      fresh.style.animation = "none";
      pulled.replaceChildren(fresh);
    });
  }
  if (!quiet) pulled.scrollIntoView({ behavior: "smooth", block: "start" });
}
function titleCase(s) { return s.replace(/\b[a-z]/g, m => m.toUpperCase()); }

async function describe(term) {
  try {
    const r = await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search=${enc(term)}`);
    const [, titles] = await r.json();
    if (!titles || !titles[0]) return "";
    const s = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${enc(titles[0].replace(/ /g, "_"))}`)).json();
    if (s.type === "disambiguation" || !s.extract) return "";
    const sentences = s.extract.match(/[^.!?]+[.!?]+/g) || [s.extract];
    return sentences.slice(0, 2).join("").trim();
  } catch { return ""; }
}

/* ============================================================
   The box: dividers + card strips
   ============================================================ */
let currentCat = "paint";
function renderTabs() {
  const tabs = $("#tabs");
  tabs.replaceChildren(...CATS.map(([k, label]) =>
    h("button", { class: "tab", role: "tab", type: "button", "aria-selected": String(k === currentCat),
      onclick: () => { currentCat = k; renderTabs(); renderStrips(); } }, label)));
}
function renderStrips() {
  const list = CARDS.filter(c => c.cat === currentCat);
  $("#boxLabel").textContent = catName(currentCat);
  $("#strips").replaceChildren(...list.map(c =>
    h("button", { class: "strip", type: "button", onclick: () => show(c.name) },
      h("span", {}, c.name), h("small", {}, isSaved(idOf(c.name)) ? "♥ saved" : c.need.length + " things"))));
}

/* ============================================================
   The red box
   ============================================================ */
function renderRed(openId) {
  $("#redSub").textContent = red.length ? `${red.length} card${red.length === 1 ? "" : "s"} kept. Tap one to pull it out.` : "Directions you've kept.";
  const view = $("#redView");
  const strips = $("#redStrips");
  if (!red.length) {
    view.replaceChildren();
    strips.replaceChildren(h("p", { class: "empty-red" }, "Empty for now. File a card and it lands here."));
    return;
  }
  strips.replaceChildren(...red.map(r =>
    h("button", { class: "strip", type: "button", onclick: () => { renderRed(r.id); $("#redView").scrollIntoView({ behavior: "smooth", block: "start" }); } },
      h("span", {}, r.name), h("small", {}, r.found ? "links" : catName(r.cat)))));
  const pick = red.find(r => r.id === openId);
  view.replaceChildren(pick ? renderCard(pick, { inRed: true }) : "");
}
function openRed() {
  renderRed(red[0] && red[0].id);
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";
  $("#closeRed").focus();
}
function closeRed() {
  $("#overlay").hidden = true;
  document.body.style.overflow = "";
  renderStrips();
  const p = $("#pulled .result");
  if (p) { // refresh save state of the pulled card
    const name = p.querySelector("h2").textContent;
    show(name, { quiet: true });
  }
  $("#tin").focus();
}

function flyToTin(card) {
  const tin = $("#tin");
  const from = card.getBoundingClientRect();
  const to = tin.getBoundingClientRect();
  const done = () => { tin.classList.remove("bump"); void tin.offsetWidth; tin.classList.add("bump"); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !document.body.animate) return done();
  const w = Math.min(from.width, 320), hgt = w * 0.6;
  const fly = h("div", { class: "flyer" });
  Object.assign(fly.style, { left: from.left + (from.width - w) / 2 + "px", top: Math.max(from.top, 20) + "px", width: w + "px", height: hgt + "px" });
  fly.style.background = getComputedStyle(card).background;
  document.body.append(fly);
  const dx = to.left + to.width / 2 - (parseFloat(fly.style.left) + w / 2);
  const dy = to.top + 20 - (parseFloat(fly.style.top) + hgt / 2);
  fly.animate([
    { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
    { transform: `translate(${dx * .5}px, ${dy * .3 - 80}px) scale(.6) rotate(-8deg)`, opacity: 1, offset: .5 },
    { transform: `translate(${dx}px, ${dy}px) scale(.15) rotate(4deg)`, opacity: .4 }
  ], { duration: 650, easing: "cubic-bezier(.5,0,.6,1)" }).onfinish = () => { fly.remove(); done(); };
}

/* ============================================================
   Wire it up
   ============================================================ */
$("#askForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#q").value.trim(); if (v) show(v); });
document.querySelectorAll(".try .chip").forEach(b => b.addEventListener("click", () => {
  show(b.hasAttribute("data-random") ? CARDS[Math.floor(Math.random() * CARDS.length)].name : b.textContent);
}));
$("#tin").addEventListener("click", openRed);
$("#closeRed").addEventListener("click", closeRed);
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeRed(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeRed(); });

renderTabs();
renderStrips();
updateCount();
</script>
</body>
</html>
